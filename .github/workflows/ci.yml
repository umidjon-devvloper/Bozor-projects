name: CI
on:
  pull_request:
  push: { branches: [main] }

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose. The single source of truth is `packageManager`
      # in the root package.json; specifying it twice makes action-setup refuse to
      # guess, and a pinned duplicate is how a runner ends up on a different pnpm
      # from every developer.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Module boundaries (ADR-0011)
        run: pnpm boundaries
      - run: pnpm test
      - run: pnpm build

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose. The single source of truth is `packageManager`
      # in the root package.json; specifying it twice makes action-setup refuse to
      # guess, and a pinned duplicate is how a runner ends up on a different pnpm
      # from every developer.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Integration tests run against a real replica set via Testcontainers (ADR-0023).
      # Mocking the database would not exercise transactions, which is the point.
      - run: pnpm test:int
